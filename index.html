<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Garante que o site fique responsivo no celular e computador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital - 8º Ano</title>
    <!-- Link para o nosso arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho principal do site -->
        <header class="cabecalho">
            <h1>Boletim Digital</h1>
            <p class="subtitulo">8º Ano | Estudante Exemplo</p>
        </header>

        <!-- Área superior com os cards de resumo -->
        <section class="cards-container">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="card-media-geral" class="valor-card">—</p>
            </div>
            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="card-total-faltas" class="valor-card">—</p>
            </div>
            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="card-bom-desempenho" class="valor-card">—</p>
            </div>
            <div class="card">
                <h3>Atenção</h3>
                <p id="card-atencao" class="valor-card">—</p>
            </div>
            <div class="card">
                <h3>Frequência</h3>
                <!-- Frequência demonstrativa fictícia -->
                <p id="card-frequencia" class="valor-card">92%</p>
                <span class="subtexto-card">Frequência adequada</span>
            </div>
        </section>

        <!-- Seção da tabela de notas e faltas -->
        <main class="tabela-secao">
            <div class="tabela-wrapper">
                <table class="tabela-boletim">
                    <thead>
                        <tr>
                            <th>Disciplina</th>
                            <th>1º Tri</th>
                            <th>2º Tri</th>
                            <th>3º Tri</th>
                            <th>Média</th>
                            <th>Faltas</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <!-- O corpo da tabela será preenchido dinamicamente pelo JavaScript -->
                    <tbody id="corpo-tabela">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Script principal de funcionamento -->
    <script src="script.js"></script>
</body>
</html>
